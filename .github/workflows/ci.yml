name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Install pinned b3sum
        run: cargo install --locked --version 1.8.7 b3sum

      - name: Fetch locked dependencies and check every crate against Cargo.lock hashsets
        run: |
          cargo fetch --locked
          python3 ./cargo-lock-hashsets.py

      - name: Run Rust unit & integration test suite
        run: cargo test --release --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cross-check Rust implementation against standalone Python/b3sum oracle
        run: |
          cargo build --release --locked
          RUST_ID=$(./target/release/git-buttress id HEAD)
          PY_ID=$(python3 ./buttress-vectors.py HEAD | awk '/^  digest/{print $2}')
          echo "Rust ID:   $RUST_ID"
          echo "Python ID: $PY_ID"
          test "$RUST_ID" = "$PY_ID"
          ./target/release/git-buttress check HEAD --no-shallow
          ./target/release/git-buttress fsck
