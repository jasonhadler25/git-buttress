name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Install pinned b3sum
        run: cargo install --locked --version 1.8.7 b3sum

      - name: Verify blake3-servil Git dependency against pinned BLAKE3 tree digest
        run: |
          cargo fetch --locked
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          B3_DB=$(ls -d "$CARGO_HOME_DIR"/git/db/blake3-* | head -n 1)
          EXPECTED=$(awk -F'"' '/^tree_blake3 =/{print $2}' Cargo.toml)
          ACTUAL=$(GIT_DIR="$B3_DB" python3 ./buttress-vectors.py --tree 2c60420c2bccbf6073e35e668691d98520f9b096 | awk '{print $3}')
          echo "Expected blake3-servil tree: $EXPECTED"
          echo "Actual   blake3-servil tree: $ACTUAL"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"

      - name: Check every fetched crate against the hashset smuggled into Cargo.lock
        run: python3 ./cargo-lock-hashsets.py

      - name: Run Rust unit & integration test suite
        run: cargo test --release --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cross-check Rust implementation against standalone Python/b3sum oracle
        run: |
          cargo build --release --locked
          RUST_ID=$(./target/release/git-buttress id HEAD)
          PY_ID=$(python3 ./buttress-vectors.py HEAD | awk '/^  digest/{print $2}')
          echo "Rust ID:   $RUST_ID"
          echo "Python ID: $PY_ID"
          test "$RUST_ID" = "$PY_ID"
          ./target/release/git-buttress check HEAD --no-shallow
          ./target/release/git-buttress fsck
