[package]
name = "git-buttress"
version = "0.3.0"
edition = "2024"
description = "Install once, keep typing plain git: smuggle BLAKE3 Merkle integrity into standard Git commits and tags"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jasonhadler25/git-buttress"

[[bin]]
name = "git-buttress"
path = "src/main.rs"

[dependencies]
blake3-servil-core = "=0.10.0"

[profile.release]
opt-level = 3
strip = "symbols"
